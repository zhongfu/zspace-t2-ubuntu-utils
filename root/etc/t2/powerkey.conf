# ZSpace T2 power button policy (read by /usr/local/sbin/t2-powerkey.py,
# started by t2-powerkey.service; restart the unit after editing).
#
# device          input device name as the kernel reports it (EVIOCGNAME).
#                 The RK809 PMIC power button is "rk805 pwrkey".  Measured:
#                 the rk3568-t2 device tree exposes the rk809 node with
#                 `system-power-controller`, the rk8xx MFD driver registers a
#                 "rk805-pwrkey" platform device from it, and
#                 drivers/input/misc/rk805-pwrkey.c names its input device
#                 "rk805 pwrkey" - so this value matches the kernel.  An empty
#                 value means "the first input device that can emit `code`".
# code            evdev key code that counts as the power button (116 =
#                 KEY_POWER, 103 = KEY_UP ...).
# press_seconds   a press held at least this long asks for a graceful
#                 poweroff the instant the hold reaches it - no release is
#                 required; anything shorter is a no-op.  A much longer hold
#                 is cut by the PMIC itself and never reaches userspace, so
#                 this must stay well below the PMIC's own long-press
#                 timeout: the RK809 hard-cuts the rails in hardware, without
#                 running systemd's shutdown (no flush, no clean unmount), so
#                 the software threshold has to fire first.
# leds_dir        sysfs LED class root (T2_POWERKEY_LEDS env overrides it).
# led             LED entry this daemon drives: red on while the button is
#                 held, then blinking once poweroff is initiated.  Same name
#                 t2-leds.sh uses ("power-led-red"); t2-leds.sh owns the
#                 steady green and must not be touched here.
# blink_seconds   red blink half-period after poweroff starts (0.25 s = 2 Hz).
device=rk805 pwrkey
code=116
press_seconds=3
leds_dir=/sys/class/leds
led=power-led-red
blink_seconds=0.25
