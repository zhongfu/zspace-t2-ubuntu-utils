# ZSpace T2: the power button belongs to t2-powerkey.service, not logind.
#
# systemd-logind's default is HandlePowerKey=poweroff, which turns *every*
# keypress - however short - into a poweroff.  The intended policy is the
# opposite: a short press is a no-op, and only a press held for a few seconds
# powers off (see /etc/t2/powerkey.conf).  Ignore the key here and let the
# service measure the press duration; a much longer hold is cut by the PMIC
# in hardware.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
