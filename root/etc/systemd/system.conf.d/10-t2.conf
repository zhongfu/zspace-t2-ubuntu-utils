# ZSpace T2: the DW watchdog (rk3568.dtsi wdt, /dev/watchdog0).
#
# The vendor ZOS ships `/etc/systemd/system.conf` with RuntimeWatchdogSec=0
# ("no userspace").  Our DTS keeps the controller enabled, so feed it:
# systemd's own service watchdog also depends on this.
#
# 30 s < the kernel's 60 s default timeout and >> the 1 s reboot grace.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
