# Root ssh access: key *and* the documented static root password.
#
# The board's only network is the USB gadget link (10.55.55.2/24, point to
# point), and a normal owner has no serial console and no key on the board, so
# key-only ssh left them with no way in at all.  The password is the same one
# hooks/40-console.sh sets for the consoles and /etc/issue prints it; the
# operator is expected to change it, and ssh.authorized_key= in the config
# partition adds a key for key-only operation.
#
# No public key is baked into the image: it would be identical on every flashed
# board.  Keys arrive per board from the config partition
# (t2-provision.service), or the operator installs one after logging in.
PermitRootLogin yes
PasswordAuthentication yes
