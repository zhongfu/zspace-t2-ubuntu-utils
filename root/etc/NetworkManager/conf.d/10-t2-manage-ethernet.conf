# Make NetworkManager manage the ethernet devices.
#
# Ubuntu ships /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf
# with `unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma`
# - i.e. ethernet is deliberately left to netplan/systemd-networkd, which this
# image does not use.  Measured on the T2 (2026-09-30, Ubuntu 26.04.1 base):
# `nmcli device status` showed
#   enxdc6294257527  ethernet  unmanaged   --
# so the wired NIC never came up and `ssh t2` was unreachable.
#
# Config files are read after the vendor directory, and a later definition of
# the same key wins, so re-listing the same exceptions with ethernet added is
# enough.  NetworkManager then creates a DHCP connection for any ethernet
# device on its own (no connection profile needed for the base image).
[keyfile]
unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma,except:type:ethernet
