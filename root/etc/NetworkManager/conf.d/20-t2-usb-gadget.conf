# The USB gadget interfaces carry a *static* address and a DHCP server of their
# own (t2-usbgadget.service + dnsmasq), so NetworkManager must not manage them:
# letting it run DHCP on a link where we are the server would fight itself.
#
# usb0 is the single CDC-NCM netdev of the gadget.
# Files in /etc/NetworkManager/conf.d are read after the vendor directory's, so
# this key wins over Ubuntu's `unmanaged-devices=*,except:...` default.
[keyfile]
unmanaged-devices=interface-name:usb0
