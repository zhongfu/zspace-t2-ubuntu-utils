# DHCP for the USB gadget link (t2-usbgadget.service).
#
# The board is 10.55.55.2/24 on usb0 (the single CDC-NCM netdev); this hands
# the laptop .10-.50 and *no* gateway/DNS of its own beyond the board, so a
# plug-in session cannot quietly route the laptop through the T2 (the link is a
# rescue channel, not a default route).  bind-dynamic is what makes interface=
# work when usb0 appears after dnsmasq started - with the default bind, dnsmasq
# would fail (or silently not serve) because the interface did not exist yet.
interface=usb0
bind-dynamic
dhcp-range=10.55.55.10,10.55.55.50,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
domain=t2.local
